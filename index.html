<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAS Web Portals</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #172033;
      }
      main {
        width: min(92vw, 520px);
        padding: 28px;
        background: white;
        border: 1px solid #dde3ee;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 22px; color: #536176; }
      a {
        display: block;
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #0f5bd7;
        color: white;
        text-decoration: none;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SAS Web Portals</h1>
      <p>Select the portal you want to open.</p>
      <a href="./teacher/">Teacher Panel Login</a>
      <a href="./student/">Student Panel Login</a>
    </main>
  </body>
</html>
